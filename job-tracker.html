<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <link rel="stylesheet" href="job-tracker.css">
    <link rel="stylesheet" href="logout.css">


    <!-- Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <h2>PrepTrack</h2>

    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="#" class="active"><i class="fa-solid fa-briefcase"></i> Jobs</a>
        <a href="prep.html"><i class="fa-solid fa-book"></i> Preparation</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>

    <div class="logout">
        <a href="#logoutModal"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<!-- MAIN -->
<main class="main">

    <!-- HEADER -->
    <header class="topbar">
        <h1>Job Tracker</h1>
        <a href="#addJob"><button class="add-btn"><i class="fa-solid fa-plus"></i> Add Job</button></a>
    </header>

    

    <!-- FILTERS -->
    <section class="filters">
        <button class="active">All</button>
        <button>Applied</button>
        <button>Interview</button>
        <button>Offer</button>
        <button>Rejected</button>
    </section>

    <!-- JOB LIST -->
    <section class="jobs">

        <article class="job-card">
            <div>
                <h3>TCS</h3>
                <p>Data Analyst</p>
            </div>
            <div class="right">
                <span class="status applied">Applied</span>

                <div class="actions">
                    <i class="fa-solid fa-pen"></i>
                    <i class="fa-solid fa-trash"></i>
                </div>
            </div>
            
        </article>

        <article class="job-card">
            <div>
                <h3>Infosys</h3>
                <p>System Engineer</p>
            </div>
            <div class="right">
                <span class="status interview">Interview</span>

                <div class="actions">
                    <i class="fa-solid fa-pen"></i>
                    <i class="fa-solid fa-trash"></i>
                </div>
            </div>
        </article>

        <article class="job-card">
            <div>
                <h3>Wipro</h3>
                <p>Project Engineer</p>
            </div>
            <div class="right">
                <span class="status rejected">Rejected</span>

                <div class="actions">
                    <i class="fa-solid fa-pen"></i>
                    <i class="fa-solid fa-trash"></i>
                </div>
            </div>
            
        </article>

        <article class="job-card">
            <div>
                <h3>Accenture</h3>
                <p>Associate</p>
            </div>
            <div class="right">
                <span class="status offer">Offer</span>

                <div class="actions">
                    <i class="fa-solid fa-pen"></i>
                    <i class="fa-solid fa-trash"></i>
                </div>
            </div>
            
        </article>

    </section>

</main>

<!-- Logout alert Box -->
<section id="logoutModal" class="modal">

    <div class="modal-content">

        <h3>Are you sure?</h3>
        <p>You will be logged out of PrepTrack.</p>

        <div class="modal-actions">
            <a href="landing.html" class="confirm">Yes, Logout</a>
            <a href="#" class="cancel">Cancel</a>
        </div>    
    </div>
</section>

<!-- AddJob Form -->
<section id="addJob" class="modal">

    <div class="modal-content">

        <!-- <a href="#" class="close">&times;</a> -->

        <h2>Add Job</h2> <br>

        <form class="form">
            <label for="company">Company</label> 
            <input class="input" type="text" id="company" placeholder="Enter company" required> 

            <label for="role">Role</label> 
            <input class="input" type="text" id="role" name="job-role" placeholder="Enter role" required>

            <label for="skills">Skills</label> 
            <input class="input" type="search" id="website" name="website" placeholder="Add skills mentioned in job description"> 

            <label for="DOA">Date of application </label> 
            <input class="input" type="date" id="DOA" name="DOA" >

            <label for="location">Location</label> 
            <input class="input" type="text" id="location" name="website" placeholder="Enter loaction if mentioned">

            <label for="website">Platform</label> 
            <input class="input" type="text" id="website" name="website" placeholder="LinkedIn / Naukri / Referral" required> 

            <label for="status">Status</label> 
            <select class="input" id="status" name="status">
                <option>Select status</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select><br>
            <div class="button"> 
                <a href=""><button type="submit" id="saveBtn">Save</button></a>
                <a href=""><button type="button">Cancel</button></a>
            </div>
        </form>

    </div>

</section>

    <script src="file.js"></script>

</body>
</html>
